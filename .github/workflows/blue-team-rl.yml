name: Blue Team RL

on:
  push:
    paths:
      - "RL/BlueTeam/**"
      - ".github/workflows/blue-team-rl.yml"
      - "Tools/export_blue_rl.py"
      - "Tools/publish_adaptive_rl.py"
      - "Tools/publish_robust_rl.py"
      - "Tools/publish_balanced_rl.py"
      - "Tools/archive_credit_pilot.py"
      - "Tools/archive_anchored_pilot.py"
      - "Tools/archive_ranking_pilot.py"
      - "Tools/archive_temporal_pilot.py"
  pull_request:
    paths:
      - "RL/BlueTeam/**"
      - ".github/workflows/blue-team-rl.yml"
      - "Tools/export_blue_rl.py"
      - "Tools/publish_adaptive_rl.py"
      - "Tools/publish_robust_rl.py"
      - "Tools/publish_balanced_rl.py"
      - "Tools/archive_credit_pilot.py"
      - "Tools/archive_anchored_pilot.py"
      - "Tools/archive_ranking_pilot.py"
      - "Tools/archive_temporal_pilot.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Cross-platform evidence/rollback checks include the published experiment bundles.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: RL/BlueTeam/Python
    steps:
      - name: Check out source without Unreal assets
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: RL/BlueTeam/Python/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install ".[test,media]"

      - name: Test policy, environment, transport, and published artifacts
        run: python -m pytest tests -q

      # This local toy checks the training/evaluation plumbing. It does not
      # reproduce the native Unreal benchmark included in Results/.
      - name: Train a local smoke-test policy
        run: >-
          python train_blue_placement.py
          --dry-run --episodes 4 --batch-size 2 --seed 22
          --checkpoint-every 0 --checkpoint-dir ci_artifacts/checkpoints
          --metrics-path ci_artifacts/training_metrics.jsonl

      - name: Evaluate the smoke-test checkpoint
        run: >-
          python evaluate_checkpoint.py
          --dry-run --episodes 3 --seed 1500000000
          --checkpoint ci_artifacts/checkpoints/episode_000004_final
          --output ci_artifacts/evaluation

      - name: Evaluate the initialized stochastic baseline
        run: >-
          python evaluate_checkpoint.py
          --dry-run --initial --stochastic --policy-seed 22
          --episodes 3 --seed 1500000000
          --output ci_artifacts/baseline

      # A separate versioned experiment; the native toy-210 artifact above is
      # preserved and is evaluated only through the explicit transfer adapter.
      - name: Train an adaptive randomized smoke-test policy
        run: >-
          python -m triad_rl.train_adaptive
          --episodes 8 --batch-size 4 --seed 22
          --validation-every 8 --validation-episodes 2
          --output ci_artifacts/adaptive

      - name: Compare adaptive policy and non-RL baselines
        run: >-
          python evaluate_adaptive.py
          --checkpoint ci_artifacts/adaptive/best
          --episodes 3 --bootstrap-samples 100 --replays 1
          --output ci_artifacts/adaptive-comparison.json

      - name: Render an offline adaptive replay
        run: >-
          python demo_adaptive.py
          --checkpoint ci_artifacts/adaptive/best --episodes 2
          --output ci_artifacts/adaptive-demo.html

      - name: Recommend a layout from an external-format snapshot
        run: >-
          python recommend_adaptive.py
          --checkpoint ../Checkpoints/adaptive-v1
          --input ../Examples/public-snapshot.json
          --catalogue ../Examples/sensor-catalogue.json --now 0
          --output ci_artifacts/adaptive-recommendation.json

      - name: Train the mixed robustness curriculum
        run: >-
          python -m triad_rl.train_robust
          --episodes 8 --batch-size 4 --seed 122
          --validation-every 8 --validation-episodes 2 --validation-run-seed 990400
          --initial-checkpoint ../Checkpoints/adaptive-v1
          --initial-selection-report ../Results/adaptive-v1/common-validation-selection.json
          --output ci_artifacts/robust

      - name: Compare capability-varied validation scenarios
        run: >-
          python evaluate_robust.py
          --checkpoint ci_artifacts/robust/best
          --initialized-checkpoint ci_artifacts/robust/initialized
          --stage validation --profile capability --seed 1000990500000000
          --episodes 3 --bootstrap-samples 100 --replays 1
          --output ci_artifacts/robust-comparison.json

      - name: Render capability-varied recorded replay
        run: >-
          python demo_robust.py
          --checkpoint ci_artifacts/robust/best --profile capability --episodes 2
          --output ci_artifacts/robust-demo.html

      - name: Train count-balanced deploy-or-stop policy
        run: >-
          python -m triad_rl.train_balanced
          --episodes 8 --batch-size 4 --seed 222
          --validation-every 8 --validation-episodes 2 --validation-run-seed 992400
          --initial-checkpoint ../Checkpoints/robust-v2-candidate
          --initial-selection-report ../Results/robust-v2/selection.json
          --output ci_artifacts/balanced

      - name: Render balanced-policy replay and external-input recommendation
        run: |
          python demo_balanced.py --checkpoint ci_artifacts/balanced/best --profile capability --seed 1000992500000000 --episodes 2 --output ci_artifacts/balanced-demo.html
          python recommend_balanced.py --checkpoint ci_artifacts/balanced/best --input ../Examples/public-snapshot.json --catalogue ../Examples/sensor-catalogue.json --now 0 --output ci_artifacts/balanced-plan.json

      - name: Save smoke-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-team-rl-smoke-${{ matrix.os }}
          path: RL/BlueTeam/Python/ci_artifacts/
          if-no-files-found: ignore
