name: Container

# Verifies the reproducibility claim the image is supposed to deliver:
#   1. It builds from a plain checkout with NO Git LFS objects present.
#   2. The full test suite, including byte-exact published-artifact checks,
#      passes inside the container with no network access.
#   3. The documented end-to-end pipeline runs to completion.
#   4. The same Dockerfile produces a native arm64 image, and the tests that
#      could plausibly differ by architecture still pass there.
#
# The Unreal image is intentionally not built here: its base image requires an
# Epic entitlement that CI cannot hold. See docker/Dockerfile.unreal.

on:
  push:
    paths:
      - "Dockerfile"
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "RL/BlueTeam/**"
      - "Tools/**"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "RL/BlueTeam/**"
      - "Tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd64:
    name: Build and verify (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # lfs: false is the point of the test. Content/ and SourceAssets/ stay as
      # pointer files and are excluded by .dockerignore, so the build must not
      # depend on them.
      - name: Check out without Git LFS objects
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: istana-rl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report interpreter and pinned versions
        run: docker run --rm istana-rl:ci versions

      - name: Full test suite, network disabled
        run: docker run --rm --network none istana-rl:ci test

      - name: End-to-end smoke pipeline
        run: |
          mkdir -p runs
          # A bind mount retains host ownership; image UID 1000 does not own
          # the GitHub runner's directory. Use the runner's unprivileged UID/GID
          # for output-producing commands, without chmod 777 or running as root.
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/runs:/workspace/runs" istana-rl:ci exec test -w /workspace/runs
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD/runs:/workspace/runs" \
            istana-rl:ci smoke

      - name: Layout recommendation from a public snapshot
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD/runs:/workspace/runs" \
            istana-rl:ci recommend

      - name: Confirm the image runs unprivileged
        run: |
          user=$(docker run --rm istana-rl:ci exec id -un)
          test "$user" = "istana" || { echo "expected user istana, got $user"; exit 1; }

      - name: Upload container artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-smoke-artifacts
          path: runs/
          if-no-files-found: ignore

  arm64:
    name: Build and verify (linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: istana-rl:ci-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report interpreter and architecture
        run: |
          out=$(docker run --rm --platform linux/arm64 istana-rl:ci-arm64 versions)
          echo "$out"
          echo "$out" | grep -q aarch64 || { echo "expected an aarch64 image"; exit 1; }

      # The whole suite under QEMU would take hours. These are the tests that
      # could plausibly differ by architecture: they re-verify archived artifacts
      # and checkpoint lineage byte for byte, so if float reduction order on
      # aarch64 moved a published number, they are what catches it.
      - name: Published-artifact verification, network disabled
        run: |
          docker run --rm --network none --platform linux/arm64 istana-rl:ci-arm64 \
            test -q -k "published or lineage or publication or bundle or portability or confirmation"

      - name: Layout recommendation from a public snapshot
        run: |
          mkdir -p runs
          docker run --rm --network none --platform linux/arm64 \
            --user "$(id -u):$(id -g)" -v "$PWD/runs:/workspace/runs" \
            istana-rl:ci-arm64 recommend
          test -s runs/temporal-plan.json || { echo "no plan written"; exit 1; }
