[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triad-rl"
version = "0.4.0"
description = "Dynamic simulation-only TRIAD sensor-placement training"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.0,<2",
  "numpy>=1.26,<3",
  "pettingzoo>=1.24,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
media = ["Pillow>=10,<13", "imageio-ffmpeg>=0.6,<0.7"]

[tool.setuptools]
packages = ["triad_rl"]
